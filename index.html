<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Study Camera</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}button:focus-visible{outline:2px solid #ffd65a;outline-offset:2px}[hidden]{display:none!important}main{position:fixed;inset:0;overflow:hidden;background:#000}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video.fit{object-fit:contain}.grid{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.grid i{border:0.5px solid #fff5}.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));background:linear-gradient(#0009,transparent)}.tools{display:flex;gap:7px}.pill,.round{background:#111c;border-radius:999px;min-height:44px;padding:0 13px;font-size:13px;font-weight:600}.round{width:48px;height:48px;padding:0;display:grid;place-items:center}.round svg{width:24px;height:24px}.pill[aria-pressed=true],.round[aria-pressed=true]{color:#ffdc60}.live{font-size:12px;background:#000c;border-radius:999px;padding:8px 10px;white-space:nowrap}.live:before{content:'';display:inline-block;background:#80e2a0;width:7px;height:7px;border-radius:50%;margin-right:6px}.controls{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;justify-items:center;padding:20px max(20px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));gap:12px;background:linear-gradient(transparent,#000a)}.shutter{width:82px;height:82px;padding:5px;border:3px solid #fff;border-radius:50%;background:#0004}.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff}.shutter:active span{background:#bbb}.album{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;background:#222;border:1px solid #fff6;padding:0;display:grid;place-items:center}.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.count{position:absolute;bottom:3px;right:3px;background:#000c;border-radius:9px;padding:2px 5px;font-size:11px}.mode,.status{position:absolute;left:50%;transform:translateX(-50%);background:#000a;border-radius:999px;padding:7px 12px;white-space:nowrap;font-size:13px;pointer-events:none}.mode{bottom:calc(112px + env(safe-area-inset-bottom));color:#ffdc60}.status{bottom:calc(151px + env(safe-area-inset-bottom));max-width:90%;white-space:normal;text-align:center}.welcome{position:absolute;inset:0;display:grid;place-items:center;background:#0009;padding:24px}.welcome div{max-width:340px;text-align:center}.welcome p,.gallery p{color:#ccc;font-size:13px;line-height:1.6}.primary{background:#fff!important;color:#111;font-weight:700;border-radius:12px;padding:13px 20px}.flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}.flash.on{animation:flash .22s ease-out}@keyframes flash{0%{opacity:.45}100%{opacity:0}}.gallery{position:fixed;inset:0;z-index:10;background:#111;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}.gallery header{display:flex;align-items:center;justify-content:space-between;gap:8px}.gallery h1{font-size:19px;margin:0}.gallery p{margin:0}.photos{overflow:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));align-content:start;gap:5px}.tile{position:relative;aspect-ratio:1;padding:0;background:#222;overflow:hidden;border-radius:5px}.tile img{width:100%;height:100%;object-fit:cover}.tile[aria-pressed=true]{outline:3px solid #ffdc60;outline-offset:-3px}.mark{position:absolute;top:5px;right:5px;width:23px;height:23px;border:1px solid white;border-radius:50%;background:#0009}.tile[aria-pressed=true] .mark{background:#ffdc60;color:#000}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1;background:#292929;padding:14px 10px;border-radius:12px}.actions .delete{color:#ff9999}
@media(orientation:landscape){.controls{left:auto;top:0;bottom:0;right:0;width:calc(118px + env(safe-area-inset-right));grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;padding:calc(18px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) 12px;background:linear-gradient(90deg,transparent,#0009)}.album{grid-row:3}.shutter{grid-row:2}.flip{grid-row:1}.top{right:calc(118px + env(safe-area-inset-right))}.mode{bottom:calc(24px + env(safe-area-inset-bottom));left:auto;right:calc(130px + env(safe-area-inset-right));transform:none}.status{bottom:calc(24px + env(safe-area-inset-bottom))}.photos{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}}
</style></head><body><main><video id="video" autoplay playsinline muted aria-label="カメラプレビュー"></video><div class="grid" id="grid" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="welcome" id="welcome"><div><h1>Study Camera</h1><p>撮影が許可されたノートや教材を記録できます。写真は端末内のアルバムに保存されます。</p><button id="start" class="primary">カメラを起動</button></div></div><div class="top"><span class="live" id="live" hidden>カメラ使用中</span><span></span><div class="tools"><button id="fit" class="pill" aria-pressed="false" aria-label="全面表示・全体表示切り替え">全面</button><button id="gridBtn" class="round" aria-label="グリッド" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/></svg></button><button id="stop" class="pill">終了</button></div></div><div class="mode">写真</div><div class="status" id="status" role="status" aria-live="polite">カメラ停止中</div><div class="controls"><button class="album" id="album" aria-label="アプリ内アルバム"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="2"/><path d="m3 17 5-5 4 4 4-5 5 6"/></svg><img id="thumb" alt="" hidden><span class="count" id="count">0</span></button><button class="shutter" id="capture" aria-label="写真を撮る" disabled><span></span></button><button class="round flip" id="flip" aria-label="カメラ切り替え" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a8 8 0 0 1 14-4l2 3m0-5v5h-5M20 14a8 8 0 0 1-14 4l-2-3m0 5v-5h5"/></svg></button></div><div class="flash" id="flash" aria-hidden="true"></div><canvas id="canvas" hidden></canvas><section class="gallery" id="gallery" hidden><header><button class="pill" id="close">‹ カメラ</button><h1>アルバム</h1><button class="pill" id="all">全選択</button></header><p id="summary">0枚</p><p>写真を選択して共有・写真に保存できます。端末内のブラウザデータを削除するとアルバムも消える場合があります。大切な写真は書き出してください。</p><p id="empty">まだ写真がありません。</p><div class="photos" id="photos"></div><div class="actions"><button id="share" class="primary" disabled>共有・写真に保存</button><button id="download" disabled>JPEG保存</button><button id="delete" class="delete" disabled>削除</button></div></section></main><script>
'use strict';const $=id=>document.getElementById(id),v=$('video'),c=$('canvas');let stream=null,epoch=0,active=false,busy=false,facing='environment',fit=false,grid=false,album=false,records=[],selected=new Set(),urls=[],thumb='',dbPromise,timer;
function msg(s){$('status').textContent=s;clearTimeout(timer);timer=setTimeout(()=>{$('status').textContent=active?'カメラ使用中':'カメラ停止中'},3500)}
function db(){return dbPromise??=new Promise((ok,no)=>{const r=indexedDB.open('study-camera-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function tx(mode,action){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('photos',mode),r=action(t.objectStore('photos'));t.oncomplete=()=>ok(r.result);t.onabort=t.onerror=()=>no(t.error)})}
function release(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;active=false;$('capture').disabled=true;$('flip').disabled=true;$('live').hidden=true}
function stop(){epoch++;release();$('welcome').hidden=album;$('start').disabled=false;$('start').textContent='カメラを起動';msg('カメラ停止中')}
async function start(){if(album)return;const my=++epoch;release();$('welcome').hidden=false;$('start').disabled=true;$('start').textContent='起動中…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPSで開いてください');const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160},aspectRatio:{ideal:4/3}}});if(my!==epoch){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;await v.play();if(my!==epoch)return;active=true;$('capture').disabled=busy;$('flip').disabled=false;$('welcome').hidden=true;$('live').hidden=false;s.getVideoTracks()[0].addEventListener('ended',()=>{if(stream===s)stop()});msg('カメラ使用中')}catch(e){if(my!==epoch)return;release();$('start').disabled=false;$('start').textContent='再試行';msg(e.name==='NotAllowedError'?'カメラの許可を確認してください':e.message||'起動できませんでした')}}
function thumbnail(){if(thumb)URL.revokeObjectURL(thumb);thumb='';if(records.length){thumb=URL.createObjectURL(records[0].blob);$('thumb').src=thumb;$('thumb').hidden=false}else{$('thumb').hidden=true;$('thumb').removeAttribute('src')}$('count').textContent=records.length}
async function refresh(){try{const stored=await tx('readonly',s=>s.getAll());const all=new Map([...stored,...records].map(r=>[r.id,r]));records=[...all.values()].sort((a,b)=>b.time-a.time);thumbnail()}catch{msg('アルバムの保存領域を利用できません')}}
function capture(){if(!active||busy||!v.videoWidth||!v.videoHeight)return;busy=true;$('capture').disabled=true;let w=v.videoWidth,h=v.videoHeight,x=0,y=0,cw=w,ch=h;if(!fit){const r=v.clientWidth/v.clientHeight;if(r>0){if(w/h>r){cw=h*r;x=(w-cw)/2}else{ch=w/r;y=(h-ch)/2}}}c.width=Math.max(1,Math.round(cw));c.height=Math.max(1,Math.round(ch));try{c.getContext('2d').drawImage(v,x,y,cw,ch,0,0,c.width,c.height)}catch{busy=false;$('capture').disabled=!active;msg('撮影できませんでした');return}$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');c.toBlob(async blob=>{try{if(!blob)throw Error('写真を作成できませんでした');const time=Date.now(),id=time+'-'+Math.random().toString(36).slice(2),r={id,time,name:'study-'+id+'.jpg',blob};try{await tx('readwrite',s=>s.put(r));msg('アルバムに保存しました')}catch{r.temporary=true;msg('一時保存のみ。閉じる前に共有してください')}records=records.filter(a=>a.id!==r.id);records.unshift(r);thumbnail();if(album)render()}catch(e){msg(e.message)}finally{busy=false;$('capture').disabled=!active}},'image/jpeg',.95)}
function clearURLs(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}
function render(){clearURLs();const host=$('photos');host.replaceChildren();$('empty').hidden=records.length>0;$('summary').textContent=records.length+'枚・'+selected.size+'枚選択中'+(records.some(r=>r.temporary)?'（一時保存あり）':'');$('share').disabled=!selected.size;$('download').disabled=selected.size!==1;$('delete').disabled=!selected.size;for(const r of records){const b=document.createElement('button');b.className='tile';b.setAttribute('aria-pressed',String(selected.has(r.id)));b.setAttribute('aria-label',new Date(r.time).toLocaleString()+'の写真');const img=document.createElement('img'),u=URL.createObjectURL(r.blob);urls.push(u);img.src=u;img.alt='撮影した写真';img.loading='lazy';const mark=document.createElement('span');mark.className='mark';mark.textContent=selected.has(r.id)?'✓':'';b.append(img,mark);b.onclick=()=>{selected.has(r.id)?selected.delete(r.id):selected.add(r.id);render()};host.append(b)}}
const chosen=()=>records.filter(r=>selected.has(r.id));$('album').onclick=async()=>{album=true;stop();selected.clear();$('gallery').hidden=false;render();await refresh();if(album)render()};$('close').onclick=()=>{album=false;clearURLs();$('gallery').hidden=true;selected.clear();start()};$('all').onclick=()=>{selected.size===records.length?selected.clear():records.forEach(r=>selected.add(r.id));render()};$('share').onclick=async()=>{const files=chosen().map(r=>new File([r.blob],r.name,{type:'image/jpeg'}));try{if(!navigator.share||!navigator.canShare?.({files})){alert('共有できない場合は1枚ずつ選ぶかJPEG保存をお試しください');return}await navigator.share({files})}catch(e){if(e.name!=='AbortError')alert('共有できませんでした')}};$('download').onclick=()=>{const r=chosen()[0];if(!r)return;const u=URL.createObjectURL(r.blob),a=document.createElement('a');a.href=u;a.download=r.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)};$('delete').onclick=async()=>{const items=chosen();if(!items.length||!confirm(items.length+'枚をアプリ内アルバムから削除しますか？'))return;try{for(const r of items){if(!r.temporary)await tx('readwrite',s=>s.delete(r.id));records=records.filter(a=>a.id!==r.id);selected.delete(r.id)}thumbnail();render()}catch{alert('一部の写真を削除できませんでした');render()}};
$('start').onclick=start;$('stop').onclick=stop;$('capture').onclick=capture;$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};$('gridBtn').onclick=()=>{grid=!grid;$('grid').hidden=!grid;$('gridBtn').setAttribute('aria-pressed',String(grid))};$('fit').onclick=()=>{fit=!fit;v.classList.toggle('fit',fit);$('fit').textContent=fit?'全体':'全面';$('fit').setAttribute('aria-pressed',String(fit))};document.addEventListener('visibilitychange',()=>{if(document.hidden&&!album)stop()});window.addEventListener('pagehide',()=>{epoch++;release()});refresh();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});
</script></body></html>
