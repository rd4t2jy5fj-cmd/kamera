<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101416"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Study Camera"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Study Camera</title><style>
*{box-sizing:border-box}html{color-scheme:dark;background:#101416}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#f3f5f4;min-height:100dvh}button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #a9e8c6;outline-offset:4px}main{max-width:780px;margin:auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:20px;font-weight:750;letter-spacing:-.5px}.sub{color:#a0aaa7;font-size:12px;margin-top:4px}.pill,.small{background:#242b2d;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:650}.pill{color:#a9e8c6}.view{position:relative;border-radius:20px;overflow:hidden;background:#1b2224;min-height:240px;aspect-ratio:3/4;max-height:59dvh;display:grid;place-items:center;border:1px solid #303939}.view video,.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.view [hidden], [hidden]{display:none!important}.gridlines{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.gridlines i{border:1px solid #fff3}.welcome{position:relative;text-align:center;padding:24px;max-width:360px}.welcome svg{width:62px;color:#a9e8c6}.welcome h2{font-size:22px;margin:12px 0 8px}.welcome p{color:#a0aaa7;line-height:1.65;font-size:13px}.primary{background:#a9e8c6;color:#12271c;padding:13px 21px;border-radius:14px;font-weight:750}.status{font-size:13px;color:#b8c5bf;min-height:20px;text-align:center;line-height:1.45;margin:0}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:12px}.side{display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;color:#b5c3bd;font-size:12px;min-height:60px;justify-content:center}.side svg{width:25px;height:25px}.shutter{justify-self:center;width:76px;height:76px;border-radius:50%;padding:6px;background:transparent;border:2px solid #f0f4f1}.shutter span{display:block;background:#f0f4f1;width:100%;height:100%;border-radius:50%}.shutter:active span{background:#a9e8c6}.review{display:grid;grid-template-columns:1fr 1fr;gap:9px}.review button{padding:14px 8px;border-radius:13px;background:#252d2e;font-weight:650;font-size:14px}.review .primary{background:#a9e8c6;color:#12271c}.hint{font-size:11px;color:#8f9b95;text-align:center;line-height:1.6;margin:0}.live{position:absolute;top:12px;left:12px;background:#131919c9;border-radius:999px;padding:7px 10px;font-size:11px;display:flex;gap:6px;align-items:center}.dot{background:#a9e8c6;width:7px;height:7px;border-radius:50%}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.on{animation:flash .25s ease-out}@keyframes flash{0%{opacity:.5}100%{opacity:0}}@media(min-width:700px){.view{aspect-ratio:4/3;max-height:65dvh}}@media(orientation:landscape) and (max-height:600px){main{max-width:100%;display:grid;grid-template-columns:1.5fr 1fr;align-content:center;align-items:center}.view{grid-column:1;grid-row:1/5;max-height:85dvh;aspect-ratio:auto;height:85dvh}header,.status,.controls,.review,.hint{grid-column:2}}
</style></head><body><main>
<header><div><div class="brand">Study Camera</div><div class="sub">ノート・プリント撮影用</div></div><button class="small" id="stop" hidden>カメラ終了</button><span class="pill" id="tag">広告なし</span></header>
<section class="view" aria-label="カメラプレビュー"><video id="video" autoplay playsinline muted hidden></video><img id="photo" alt="撮影した写真" hidden><div class="gridlines" id="grid" hidden aria-hidden="true"> <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="live" id="live" hidden><span class="dot"></span>カメラ使用中</div><div id="welcome" class="welcome"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 15h8l3-5h12l3 5h8v24H7z" stroke-linejoin="round"/><circle cx="24" cy="26" r="8"/></svg><h2>勉強の記録を、手軽に。</h2><p>撮影が許可されている教材や自分のノートを記録できます。写真は端末内で処理します。</p><button id="start" class="primary">カメラを起動</button></div><div class="flash" id="flash" aria-hidden="true"></div></section>
<p class="status" id="status" role="status" aria-live="polite">カメラの使用を許可して始める</p>
<div class="controls" id="controls"><button id="gridBtn" class="side" disabled aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/></svg>グリッド</button><button class="shutter" id="capture" aria-label="写真を撮る" disabled><span></span></button><button id="flip" class="side" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a8 8 0 0 1 14-4l2 3m0-5v5h-5M20 14a8 8 0 0 1-14 4l-2-3m0 5v-5h5"/></svg>切り替え</button></div>
<div class="review" id="review" hidden><button id="retake">撮り直す／次へ</button><button id="share" class="primary">共有・写真に保存</button><button id="download" style="grid-column:1/-1">JPEGファイルを保存</button></div><p class="hint">アプリ独自のシャッター音・広告・撮影回数制限なし。端末のカメラ設定や利用ルールは変更しません。</p><canvas id="canvas" hidden></canvas></main>
<script>
'use strict';const $=id=>document.getElementById(id);const video=$('video'),photo=$('photo'),canvas=$('canvas');let stream=null,facing='environment',showGrid=false,file=null,url=null,epoch=0,mode='idle';
const status=s=>$('status').textContent=s;const hidden=(id,v)=>$(id).hidden=v;
function release(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
function clearPhoto(){if(url)URL.revokeObjectURL(url);url=null;file=null;photo.removeAttribute('src');}
function render(next){mode=next;const active=next==='live',review=next==='review',loading=next==='loading';hidden('welcome',active||review);hidden('video',!active);hidden('photo',!review);hidden('grid',!active||!showGrid);hidden('live',!active);hidden('stop',!active&&!review&&!loading);hidden('tag',active||review||loading);hidden('controls',review);hidden('review',!review);for(const id of ['capture','flip','gridBtn'])$(id).disabled=!active;$('start').disabled=loading;$('start').textContent=loading?'起動中…':'カメラを起動';}
function stop(message='カメラを終了しました'){epoch++;release();clearPhoto();render('idle');status(message);}
async function start(){const my=++epoch;release();clearPhoto();render('loading');status('カメラの許可を確認中…');try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPSのSafariで開いてください。');const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160}}});if(my!==epoch){s.getTracks().forEach(t=>t.stop());return;}stream=s;video.srcObject=s;await video.play();if(my!==epoch)return;render('live');const t=s.getVideoTracks()[0];t.addEventListener('ended',()=>{if(stream===s)stop('カメラ接続が終了しました。');});status('撮影ボタンで写真を記録');}catch(e){if(my!==epoch)return;release();render('idle');const errors={NotAllowedError:'カメラが許可されていません。Safariや端末の設定をご確認ください。',NotFoundError:'使用できるカメラがありません。',NotReadableError:'カメラが使用できません。他のカメラアプリを閉じてください。'};status(errors[e.name]||e.message||'カメラを起動できませんでした。');}}
$('start').onclick=start;$('stop').onclick=()=>stop();$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';start();};$('gridBtn').onclick=()=>{showGrid=!showGrid;hidden('grid',!showGrid);$('gridBtn').setAttribute('aria-pressed',String(showGrid));$('gridBtn').style.color=showGrid?'#a9e8c6':'';};
$('capture').onclick=()=>{if(mode!=='live'||!video.videoWidth||!video.videoHeight){status('カメラの準備ができてから撮影してください。');return;}const my=epoch;$('capture').disabled=true;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);const flash=$('flash');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');canvas.toBlob(blob=>{if(my!==epoch)return;if(!blob){$('capture').disabled=false;status('撮影できませんでした。もう一度お試しください。');return;}clearPhoto();file=new File([blob],'study-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg',{type:'image/jpeg'});url=URL.createObjectURL(file);photo.src=url;release();render('review');status(canvas.width+' × '+canvas.height+' px ・保存してから次の撮影へ');},'image/jpeg',.95);};
$('retake').onclick=()=>{if(file&&!confirm('未保存の場合、写真が消えます。次の撮影に進みますか？'))return;start();};$('download').onclick=()=>{if(!file||!url)return;const a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();status('ダウンロード先を確認してください。');};$('share').onclick=async()=>{if(!file)return;try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file]});status('共有メニューを閉じました。保存先を確認してください。');}else{status('このブラウザは写真共有に非対応です。JPEG保存を使ってください。');}}catch(e){if(e.name!=='AbortError')status('共有できませんでした。JPEG保存をお試しください。');}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(mode==='live'||mode==='loading'))stop('カメラを停止しました。再開するには起動してください。');});window.addEventListener('pagehide',()=>{if(mode==='live'||mode==='loading')stop();});render('idle');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
